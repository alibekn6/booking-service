# Local use: `uv run alembic revision --autogenerate -m "..."`, `uv run alembic upgrade head`.
# The URL comes from DATABASE_URL (app settings). Containers use `python -m app.cli migrate`.
[alembic]
script_location = %(here)s/src/app/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
