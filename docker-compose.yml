name: bookingservice

x-app-env: &app-env
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://booking:booking@postgres:5432/booking
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"
  HOLD_TTL_S: ${HOLD_TTL_S:-600}
  MAX_SEATS_PER_BUYER: ${MAX_SEATS_PER_BUYER:-4}

# One image for api / sweeper / migrate; only `migrate` declares the build so that
# compose builds it once (parallel builds of the same tag collide).
x-app: &app
  image: bookingservice:local
  pull_policy: never
  restart: unless-stopped
  environment: *app-env

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    build: .
    pull_policy: build
    command: ["python", "-m", "app.cli", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-6}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      HOLD_RATE_LIMIT_PER_MINUTE: ${HOLD_RATE_LIMIT_PER_MINUTE:-30}
      ACCESS_LOG: ${ACCESS_LOG:-true}
      # uvicorn reads UVICORN_* env vars, so the Dockerfile CMD stays untouched.
      # A burst of thousands of new connections at sale start overflows the default
      # accept queue (2048); keep-alive must outlive the client's idle time
      # (on AWS: longer than the ALB idle timeout, 60 s).
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-16384}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-75}
    ports:
      - "${API_PORT:-8080}:8000"
    sysctls:
      net.core.somaxconn: 16384
      net.ipv4.tcp_max_syn_backlog: 16384
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  sweeper:
    <<: *app
    command: ["python", "-m", "app.cli", "sweeper"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
